{{- if and (not .Values.alerts.existingSecret) (or .Values.alerts.webhookUrl .Values.alerts.telegramBotToken) }}
{{- if ne (empty .Values.alerts.telegramBotToken) (empty .Values.alerts.telegramChatId) }}
{{- fail "alerts.telegramBotToken and alerts.telegramChatId must be set together" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "permwatch.fullname" . }}
  labels:
    {{- include "permwatch.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.alerts.webhookUrl }}
  PERMWATCH_WEBHOOK_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.alerts.telegramBotToken }}
  PERMWATCH_TELEGRAM_BOT_TOKEN: {{ . | quote }}
  PERMWATCH_TELEGRAM_CHAT_ID: {{ $.Values.alerts.telegramChatId | quote }}
  {{- end }}
{{- end }}
