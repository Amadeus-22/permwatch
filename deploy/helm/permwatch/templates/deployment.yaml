apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "permwatch.fullname" . }}
  labels:
    {{- include "permwatch.labels" . | nindent 4 }}
spec:
  # One process owns the state directory (docs/adr/0002), so never two pods.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "permwatch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when the watch list or the alert settings change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "permwatch.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: permwatch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["watch"]
          env:
            - name: PERMWATCH_CONFIG_FILE
              value: /etc/permwatch/watchlist.yaml
            - name: PERMWATCH_STATE_DIR
              value: /data
            - name: PERMWATCH_HTTP_ADDR
              value: ":8080"
            - name: PERMWATCH_API_URL
              value: {{ .Values.config.apiUrl | quote }}
            - name: PERMWATCH_NODE_URL
              value: {{ .Values.config.nodeUrl | quote }}
            - name: PERMWATCH_POLL_INTERVAL
              value: {{ .Values.config.pollInterval | quote }}
            - name: PERMWATCH_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
          {{- if include "permwatch.hasAlertSecret" . }}
          envFrom:
            - secretRef:
                name: {{ include "permwatch.secretName" . }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/permwatch
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: {{ include "permwatch.fullname" . }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "permwatch.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
